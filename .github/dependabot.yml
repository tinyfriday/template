# 의존성 업데이트. 패치는 AI 가 병합해도 된다(CLAUDE.md 2절). 그 밖은 PR 에서 판단.
# npm·pip 를 쓰게 되면 아래 주석을 푼다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # 워크플로마다 따로 PR 이 오지 않게 액션 업데이트를 PR 하나로 묶는다.
      actions:
        patterns: ["*"]
