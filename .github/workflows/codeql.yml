# 보안 정적 분석. 기본은 워크플로(actions)만 본다.
# 코드가 생기면 languages 에 javascript-typescript / python 을 더한다.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * 0" # 월 03:00 KST

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
