# 보안 정적 분석. 기본은 워크플로(actions)만 본다.
# 코드가 생기면 languages 에 javascript-typescript / python 을 더한다.
# 비공개 저장소는 Advanced Security 없이는 결과를 올릴 수 없어서 건너뛴다(공개로 바꾸면 자동으로 돈다).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * 0" # 월 03:00 KST

permissions:
  actions: read # 업로드 때 실행 정보를 읽는다. 없으면 "Resource not accessible by integration"
  contents: read
  security-events: write

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
